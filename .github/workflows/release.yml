name: Release LSP

# Publishes the core language-server binary. Triggered by `v<semver>` tags
# ONLY — the VS Code extension has its own release workflow triggered by
# `vscode-v<semver>` tags so the two can ship independently.
#
# Do NOT use this workflow for tags that carry an editor-scoped prefix.
on:
  push:
    tags:
      - "v*.*.*"
      - "!vscode-v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
